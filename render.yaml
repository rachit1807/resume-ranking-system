services:
  - type: web
    name: resume-ranking-system-rachit
    runtime: docker
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-ranking-system-db
          property: connectionString

databases:
  - name: resume-ranking-system-db
    databaseName: resume_rankings
    user: resume_ranker
    region: singapore
    plan: free
    ipAllowList: []
